name: Practice / Cleanup

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: practice-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    name: Practice / Expire inactive sessions
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Remind or expire inactive sessions
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/practice/workflow.mjs cleanup
