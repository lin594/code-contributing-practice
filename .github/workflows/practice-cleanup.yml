name: Practice / Cleanup

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: practice-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    name: Practice / Expire inactive sessions
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted default branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"

      - name: Remind or expire inactive sessions
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/practice/workflow.mjs cleanup
