name: Practice / Grade

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - edited
      - ready_for_review
      - labeled
      - unlabeled
  issue_comment:
    types:
      - created
      - edited

permissions: {}

concurrency:
  group: practice-grade-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  grade:
    name: Practice / Grade
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      eligible: ${{ steps.grade.outputs.eligible }}
      outcome: ${{ steps.grade.outputs.outcome }}
      head_sha: ${{ steps.grade.outputs.head_sha }}
      pr_number: ${{ steps.grade.outputs.pr_number }}
    steps:
      - name: Check out trusted default branch only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Grade metadata and files as inert data
        id: grade
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/practice/workflow.mjs grade-pr

      - name: Fail required practice checks
        if: steps.grade.outputs.outcome == 'fail'
        run: exit 1

  merge:
    name: Practice / Automatic squash merge
    needs: grade
    if: needs.grade.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Check out trusted default branch only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Revalidate exact head and merge
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.grade.outputs.pr_number }}
          EXPECTED_HEAD: ${{ needs.grade.outputs.head_sha }}
        run: node scripts/practice/workflow.mjs merge-pr
