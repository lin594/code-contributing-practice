name: "Exercise 9 · 从 CI 失败中定位问题"
description: 阅读失败日志、本地复现并用当前 commit 证明修复
title: "[Exercise 9] "
labels:
  - exercise:9
body:
  - type: markdown
    attributes:
      value: |
        本关要求先完成 Exercise 8。第一次 CI 失败是练习素材，不要提前修复或另开 PR。开始前阅读[第 9 课](https://github.com/lin594/code-contributing-practice/blob/main/docs/lessons/09-ci-diagnostics.md)。
  - type: checkboxes
    id: preparation
    attributes:
      label: 开始前确认
      options:
        - label: 我已经完成 Exercise 8。
          required: true
        - label: 第一次提交只填写学习者用户名，保留失效链接和诊断 TODO。
          required: true
        - label: 我会根据 Checks 日志和本地命令判断结果，不把 AI 的口头判断当作通过证据。
          required: true
  - type: textarea
    id: evidence
    attributes:
      label: 什么能证明一个 PR 的当前版本通过了检查？
      description: 先用自己的话回答；完成练习后再回来看是否需要修正。
      placeholder: 例如：检查结果需要对应……
    validations:
      required: true
