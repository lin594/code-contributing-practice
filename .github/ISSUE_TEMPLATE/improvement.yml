name: 改进这个训练仓库
description: 报告文档问题、自动化缺陷或提出课程建议
title: "[Improvement] "
labels:
  - enhancement
body:
  - type: dropdown
    id: area
    attributes:
      label: 涉及范围
      options:
        - 课程文档
        - GitHub Actions / 自动反馈
        - Issue / PR 模板
        - 其他
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 当前问题
      description: 请描述你遇到的行为和期望行为。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 可选；不需要先写代码。
