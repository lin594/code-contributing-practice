name: "Exercise 1 · 第一次 Pull Request"
description: 走通 Fork、branch、commit、push 和第一次 PR
title: "[Exercise 1] "
labels:
  - exercise:1
body:
  - type: markdown
    attributes:
      value: |
        先完成[准备篇](https://github.com/lin594/code-contributing-practice/blob/main/docs/getting-started.md)并阅读[第 1 课](https://github.com/lin594/code-contributing-practice/blob/main/docs/lessons/01-first-pull-request.md)。创建后，机器人会提供隔离的训练分支和准确命令。
  - type: checkboxes
    id: preparation
    attributes:
      label: 开始前确认
      options:
        - label: 我已 Fork、clone，并确认 origin 指向自己的 Fork、upstream 指向课程原仓库。
          required: true
        - label: 我会使用机器人提供的 topic branch，不直接在 main/master 上练习。
          required: true
        - label: 我知道红灯应在原 PR 中修复，不会通过新建多个 PR 碰运气。
          required: true
  - type: textarea
    id: goal
    attributes:
      label: 本关目标
      description: 用自己的话写出希望走通的流程，不影响自动判定。
      placeholder: 例如：我想知道本地 commit 如何通过 PR 到达上游。
    validations:
      required: true
