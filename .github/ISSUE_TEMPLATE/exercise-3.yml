name: "Exercise 3 · 清晰地发起协作"
description: 练习 branch、Issue 关联、PR 标题与可验证说明
title: "[Exercise 3] "
labels:
  - exercise:3
body:
  - type: markdown
    attributes:
      value: |
        本关要求先完成 Exercise 2。从这里开始，清晰 branch、PR 标题和 `Closes #...` 会成为必需项。先阅读[第 3 课](https://github.com/lin594/code-contributing-practice/blob/main/docs/lessons/03-clear-collaboration.md)。
  - type: checkboxes
    id: preparation
    attributes:
      label: 开始前确认
      options:
        - label: 我已经完成 Exercise 2。
          required: true
        - label: 我会在 PR 正文写明完成内容和验证方式，而不只写“修改”。
          required: true
        - label: 我会检查 Closes 后的编号属于当前 Exercise Issue。
          required: true
  - type: textarea
    id: reviewer
    attributes:
      label: 站在评审者角度
      description: 一个不了解背景的人，最需要从 PR 中看到哪两类信息？
      placeholder: 用自己的话回答。
    validations:
      required: true
