name: "Exercise 4 · Draft Pull Request"
description: 先分享草稿，作者自查后再正式请求评审
title: "[Exercise 4] "
labels:
  - exercise:4
body:
  - type: markdown
    attributes:
      value: |
        本关要求先完成 Exercise 3。第一次红灯是课程的一部分：机器人要先看到 Draft，再看到 Ready for review。开始前阅读[第 4 课](https://github.com/lin594/code-contributing-practice/blob/main/docs/lessons/04-draft-pull-request.md)。
  - type: checkboxes
    id: preparation
    attributes:
      label: 开始前确认
      options:
        - label: 我已经完成 Exercise 3。
          required: true
        - label: 我会选择 Create draft pull request，而不是直接创建普通 PR。
          required: true
        - label: 我会检查 Conversation、Commits、Files changed 和 Checks 后再点击 Ready for review。
          required: true
  - type: textarea
    id: readiness
    attributes:
      label: 什么叫“可以评审”？
      placeholder: 写出至少一条你会检查的完成标准。
    validations:
      required: true
