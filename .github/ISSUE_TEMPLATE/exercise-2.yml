name: "Exercise 2 · 干净的提交历史"
description: 在一个 PR 中完成两条清晰、线性的提交
title: "[Exercise 2] "
labels:
  - exercise:2
body:
  - type: markdown
    attributes:
      value: |
        本关要求先完成 Exercise 1。机器人会检查本关恰好有两条提交且没有 merge commit。
  - type: checkboxes
    id: preparation
    attributes:
      label: 开始前确认
      options:
        - label: 我已经完成 Exercise 1。
          required: true
        - label: 我会从机器人提供的新 base 创建新分支，不复用上一关分支。
          required: true
        - label: 我知道 commit message 不规范只会收到 Warning，不会阻断练习。
          required: true
  - type: textarea
    id: question
    attributes:
      label: 当前对提交历史的疑问
      placeholder: 没有疑问时可以写“暂无”。
    validations:
      required: true
