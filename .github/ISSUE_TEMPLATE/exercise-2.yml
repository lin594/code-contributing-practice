name: "Exercise 2 · 暂存区与原子提交"
description: 按顺序完成两件事，形成两条清晰的线性 commit
title: "[Exercise 2] "
labels:
  - exercise:2
body:
  - type: markdown
    attributes:
      value: |
        本关要求先完成 Exercise 1。开始前阅读[第 2 课](https://github.com/lin594/code-contributing-practice/blob/main/docs/lessons/02-atomic-commits.md)。
  - type: checkboxes
    id: preparation
    attributes:
      label: 开始前确认
      options:
        - label: 我已经完成 Exercise 1。
          required: true
        - label: 我会从新的机器人 base 创建分支，不复用上一关分支。
          required: true
        - label: 我会先完成并提交第一部分，再编辑和提交第二部分。
          required: true
  - type: textarea
    id: prediction
    attributes:
      label: 执行前预测
      description: 如果一次填完两个 TODO 并一次 git add，为什么难以得到两条原子 commit？
      placeholder: 用一两句话回答。
    validations:
      required: true
